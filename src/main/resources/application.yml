spring:
  application:
    name: cartsync
  datasource:
    url: jdbc:postgresql://localhost:5432/cartsync
    username: cartsync
    password: secret
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: "1"
      retries: 3
    consumer:
      group-id: cartsync-main
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.cartsync.event"

cartsync:
  idempotency:
    ttl-seconds: 86400
  cart:
    lock-retries: 3
    lock-backoff-ms: 50